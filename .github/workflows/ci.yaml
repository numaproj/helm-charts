name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - upgrade
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - upgrade

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Step 2: Set up Helm"
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: "Step 3: Setup python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: "Step 4: Set up chart-testing"
        uses: helm/chart-testing-action@v2.6.1

      - name: "Step 5: Run chart-testing (list-changed)"
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Step 6: Run lint"
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: "Step 7: Create kind cluster"
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: "Step 7: Run chart install"
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Step 2: Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: upgrade/go.mod

      - name: "Step 3: Build upgrade tool"
        run: cd upgrade && mkdir -p bin && go build -o bin/upgrade .

      - name: "Step 4: Check mirrored files are in sync"
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:charts/numaflow/Chart.yaml | grep '^appVersion:' | awk '{print $2}')
          HEAD_VERSION=$(grep '^appVersion:' charts/numaflow/Chart.yaml | awk '{print $2}')
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "appVersion unchanged (${HEAD_VERSION}), skipping sync check"
            exit 0
          fi
          echo "appVersion bumped ${BASE_VERSION} -> ${HEAD_VERSION}, checking sync"
          NUMAFLOW_VERSION="v${HEAD_VERSION}" ./upgrade/bin/upgrade sync --from-version="v${BASE_VERSION}"

  release:
    if: github.ref == 'refs/heads/main'
    needs:
      - lint-test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: "Step 2: Install Helm"
        uses: azure/setup-helm@v4

      - name: "Step 3: Run chart-releaser"
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
          pages_branch: gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
