{{- if and (eq .Values.configs.webhook.enabled true) (eq .Values.configs.namespacedScope false) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ tpl .Values.configs.webhook.name . }}
  labels:
      {{- include "numaflow.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: numaflow-webhook
      app.kubernetes.io/name: numaflow-webhook
      app.kubernetes.io/part-of: numaflow
  template:
    metadata:
      labels:
        app.kubernetes.io/component: numaflow-webhook
        app.kubernetes.io/name: numaflow-webhook
        app.kubernetes.io/part-of: numaflow
    spec:
      containers:
        - args:
            - webhook-service
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "443"
            - name: DEPLOYMENT_NAME
              value: {{ tpl .Values.configs.webhook.name . }}
            - name: SERVICE_NAME
              value: {{ tpl .Values.configs.webhook.service.name . }}
            - name: CLUSTER_ROLE_NAME
              value: numaflow-webhook
          image: {{ .Values.numaflow.image.repository }}:{{ .Values.numaflow.image.tag }}
          imagePullPolicy: {{ .Values.numaflow.image.pullPolicy }}
          name: webhook
          resources:
            {{- toYaml .Values.configs.webhook.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.configs.webhook.securityContext | nindent 12 }}
      serviceAccountName: numaflow-webhook-sa
      securityContext:
        {{- toYaml .Values.configs.webhook.podSecurityContext | nindent 8 }}
{{- end }}