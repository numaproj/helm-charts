{{- if .Values.dexServer.enabled }}
apiVersion: v1
data:
  {{/* Converts to JSON in order to be able to use tpl function then finally convert back to YAML */}}
  {{ .Values.dexServer.configMap.key }}: |-
    {{- tpl (.Values.dexServer.configMap.data | toJson ) . | fromJson | toYaml | nindent 4 }}
kind: ConfigMap
metadata:
  name: {{ .Values.dexServer.configMap.name }}
  labels:
    {{- include "numaflow.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
{{- end }}
